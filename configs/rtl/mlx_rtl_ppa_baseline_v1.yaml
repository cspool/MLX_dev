rtl_sources:
  - rtl/mlx/mlx_fp16.sv
  - rtl/mlx/mlx_config_network.sv
  - rtl/mlx/mlx_data_network.sv
  - rtl/mlx/mlx_tag_buffer.sv
  - rtl/mlx/mlx_control_logic.sv
  - rtl/mlx/mlx_register_file.sv
  - rtl/mlx/mlx_fu.sv
  - rtl/mlx/mlx_pe_top.sv

components:
  config_network: {top: mlx_config_network, scope: config_network, has_clock: true}
  data_network: {top: mlx_data_network, scope: data_network, has_clock: true}
  control_logic: {top: mlx_control_logic, scope: control_logic, has_clock: false}
  tag_buffer: {top: mlx_tag_buffer, scope: tag_buffer, has_clock: true}
  register_file: {top: mlx_register_file, scope: register_file, has_clock: true}
  fu_simd32: {top: mlx_fu, scope: functional_unit, has_clock: true}

variants:
  full:
    parameters:
      register_file: {SIMD_WIDTH: 32}
      fu_simd32: {SIMD_WIDTH: 32, FULL_FEATURES: 1}
    vcds:
      - {workload: bsmm, path: artifacts/environment/h198/sim/full-bsmm.vcd}
      - {workload: fft_cmp, path: artifacts/environment/h198/sim/full-fft_cmp.vcd}
      - {workload: swa, path: artifacts/environment/h198/sim/full-swa.vcd}
  reduced:
    parameters:
      register_file: {SIMD_WIDTH: 8}
      fu_simd32: {SIMD_WIDTH: 8, FULL_FEATURES: 0}
    vcds:
      - {workload: bsmm, path: artifacts/environment/h198/sim/reduced-bsmm.vcd}
    power_components: [register_file, fu_simd32]
    reuse_full_average_power: [config_network, data_network, control_logic, tag_buffer]

measurement:
  clock_period_ns: 1.0
  full_power_average: arithmetic_mean_of_bsmm_fft_cmp_swa
  reduced_power: reused_full_noncompute_plus_reduced_bsmm_rf_fu
  area_source: yosys_abc_nangate45_liberty_cell_sum
  power_source: openroad_opensta_vcd_activity

transfer:
  target_section: table2_area_power
  calibration_area: pe.area_mm2 / sum_full_component_raw_area
  calibration_power: pe.power_mw / sum_full_component_raw_power
  array_pes: 16
  maximum_relative_error: 0.15
  prohibited_per_component_coefficients: true

source_layout:
  protocol: experiments/h199-mlx-rtl-ppa-baseline/protocol.md
  config: configs/rtl/mlx_rtl_ppa_baseline_v1.yaml
  power_tcl: rtl/ppa/openroad_component_power.tcl
  vcd_extractor: scripts/extract_vcd_scope.py
  runner: scripts/run_mlx_rtl_ppa_baseline.py
  auditor: scripts/audit_mlx_rtl_ppa_baseline.py
  test: tests/test_mlx_rtl_ppa_baseline.py

output_root: artifacts/environment/h199
measurement_manifest: artifacts/environment/h199/ppa-measurement-manifest.json
result_path: artifacts/results/mlx-rtl-ppa-baseline-run204.json
