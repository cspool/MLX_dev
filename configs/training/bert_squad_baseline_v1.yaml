version: 1
experiment_id: H11
classification: native_checkpoint_finetuning
description: "Inferred BERT-base/SQuAD 1.1 reconstruction of the unmodified Fig. 15(b) baseline"

model:
  path: third_party/models/bert-base-uncased-msdownload
  source: "modelscope://google-bert/bert-base-uncased"
  revision: "fbb17953beb5f9627a4342b49b0f1ce9fa10596a"
  weights_sha256: "68d45e234eb4a928074dfd868cead0219ab85354cc53d20e772753c6bb9169d3"

dataset:
  train: third_party/data/squad/train-v1.1.json
  validation: third_party/data/squad/dev-v1.1.json
  train_sha256: "3527663986b8295af4f7fcdff1ba1ff3f72d07d61a20f487cb238a6ef92fd955"
  validation_sha256: "95aa6a52d5d6a735563366753ca50492a658031da74f301ac5238b03966972c9"

preprocessing:
  max_sequence_length: 384
  document_stride: 128
  pad_to_multiple_of: 8
  question_whitespace: lstrip

optimization:
  seed: 42
  epochs: 2
  per_device_train_batch_size: 16
  gradient_accumulation_steps: 2
  effective_batch_size: 32
  learning_rate: 3.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  scheduler: linear
  optimizer: adamw_torch_fused
  max_gradient_norm: 1.0
  dtype: bfloat16
  tf32: true
  device: cuda:0
  dataloader_workers: 4

evaluation:
  per_device_batch_size: 32
  n_best_size: 20
  max_answer_length: 30
  metric: official_squad_v1_normalized_exact_and_token_f1

paper_targets:
  f1_pct: 87.7
  exact_match_pct: 79.1
  maximum_relative_error: 0.10

outputs:
  checkpoint_dir: third_party/checkpoints/bert-squad-baseline-run014
  report: artifacts/results/bert-squad-baseline-run014.json
