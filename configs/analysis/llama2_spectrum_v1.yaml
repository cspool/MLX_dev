version: 1
experiment_id: H16
classification: inferred_native_activation_measurement
description: "Frozen Llama2-7B Q/K/V sequence-spectrum reconstruction for Figures 5 and 6"

model:
  path: third_party/models/llama2-7b-hf-msmirror
  official_source: "huggingface://meta-llama/Llama-2-7b-hf"
  official_revision: "01c7f73d771dfac7d292323805ebc428287df4f9"
  mirror_source: "modelscope://f541119578/Llama-2-7b-hf"
  mirror_revision: master
  required_official_hashes:
    model-00001-of-00002.safetensors: "4ec71fd53e99766de38f24753b30c9e8942630e9e576a1ba27b0ec531e87be41"
    model-00002-of-00002.safetensors: "41780b5dac322ac35598737e99208d90bdc632a1ba3389ebedbb46a1d8385a7f"
    tokenizer.model: "9e556afd44213b6bd1be2b850ebbbd98f5481437a8021afaf58ee7fb1818d347"
  config_signature:
    hidden_size: 4096
    num_hidden_layers: 32
    num_attention_heads: 32
    num_key_value_heads: 32
    vocab_size: 32000
    max_position_embeddings: 4096

dataset:
  path: third_party/data/wikitext-msdownload/wikitext-2-raw-v1/test-00000-of-00001.parquet
  sha256: "5f1bea067869d04849c0f975a2b29c4ff47d867f484f5010ea5e861eab246d91"
  source: "modelscope://Salesforce/wikitext"
  revision: "998a61e72d01782315d6e24fb78aa22d5a74b1d4"
  text_column: text
  row_separator: "\n\n"

sampling:
  add_special_tokens: false
  sequence_length: 1024
  start_token: 0
  window_count: 32
  batch_size: 1

spectrum:
  projections: [q, k, v]
  capture_point: pre_rope_projection_output
  sequence_centering: subtract_per_feature_mean
  fft: real_rfft_fp32
  exclude_dc: true
  power: squared_magnitude
  reduction: mean_over_windows_and_projection_features
  frequency_groups: 21
  grouping: contiguous_nearly_equal_width_tensor_split
  group_energy: sum
  normalization:
    fig6: divide_layer1_and_layer16_k_by_their_shared_max_group_energy
    fig5: none_required_for_scale_invariant_dominant_peak
  dominant_frequency:
    definition: highest_local_peak_at_or_above_relative_threshold
    relative_to_global_peak: 0.5
    endpoints_are_local_peaks: true

runtime:
  model_dtype: bfloat16
  fft_dtype: float32
  device: cuda:0
  cuda_visible_device: 1
  use_cache: false

paper_targets:
  manifest: artifacts/targets/fig5-6_spectrum_digitization_pixels.yaml
  numerical_gate: "all 42 Fig. 6 bars have relative error <= 0.10"
  qualitative_gate: "all three Fig. 5 direction checks pass"

outputs:
  report: artifacts/results/llama2-spectrum-run019.json
