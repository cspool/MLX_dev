semantic_contract:
  scheduling_unit: tagged static layer block
  block_fields:
    - tag
    - ordered instruction sequence
    - loop trip count
    - predecessor tags
  active_window:
    admission: lowest not-yet-admitted ready layer tags first
    capacity: configurable positive integer
    completion: all loop iterations and in-flight instructions have retired
  pipelines: [load, store, compute, xfer]
  arbitration:
    primary: smaller ready tag
    secondary: round-robin within equal tag
    issue_requires: pipeline and selected subresource are available
  programmable_pe:
    compute_resources: operation-specific functional-unit class, latency, and initiation interval
    register_file: configurable banks plus finite read/write ports per cycle
    scoreboard: per-tag register readiness and pending writer
    excluded_gpu_state: [warp, SIMT reconvergence, CTA residency, GPU coherence]
  skip_hop:
    dimensions: deterministic dimension-order XY
    packet_fields: [residual hops, direction, destination register, tag]
    routing: consume the largest admissible configured step not exceeding residual distance
    router_state: no routing table, no virtual channel, no adaptive path search
    contention: one packet per directed skip link per cycle unless configured otherwise

microarchitecture_fixture:
  active_window: 3
  register_file:
    banks: 4
    read_ports: 2
    write_ports: 1
  functional_units:
    add: {class: alu, latency: 2, initiation_interval: 1}
    mul: {class: mul, latency: 3, initiation_interval: 1}
    fma: {class: fma, latency: 4, initiation_interval: 1}
    fexp: {class: transcendental, latency: 8, initiation_interval: 4}
  pipelines:
    load: {latency: 3, initiation_interval: 1}
    store: {latency: 2, initiation_interval: 1}
    xfer: {latency_per_hop: 1, initiation_interval: 1}
  routing:
    mesh_width: 4
    mesh_height: 4
    skip_steps: [2, 1]
  provenance: synthetic invariant fixture; no value is fitted to an MLX result

registered_microtraces:
  - id: lower_tag_compute_contention
    assertion: tags 1 and 2 ready for one compute resource issue in tag order
  - id: four_pipeline_overlap
    assertion: independent tags occupy load, store, compute, and xfer concurrently and finish faster than serialized execution
  - id: active_window_bound
    assertion: resident unfinished tags never exceed three
  - id: register_raw_and_bank_pressure
    assertion: consumers cannot issue before producer writeback and RF port/bank limits are honored
  - id: fu_initiation_interval
    assertion: two fexp instructions issue at least four cycles apart even though other FU classes may issue
  - id: greedy_skip_hop
    assertion: residual distances 1, 2, and 3 route as [1], [2], and [2,1] in each signed dimension
  - id: adjacent_layer_dependency
    assertion: a successor tag is admitted only after its registered predecessor completion event
  - id: deterministic_replay
    assertion: two executions produce byte-identical canonical event traces and summaries

regression_gate:
  command: scripts/run_open_simulator_smokes.sh dsagen
  overlay_environment_absent: true
  expected_metrics:
    cgra_instances: 256
    cgra_instructions: 1024
    roi_cycles: 569
    sanity_check_passed: true

pass_criteria:
  - implementation is compiled as part of pinned dsa-gem5 and instantiated by accel_t
  - overlay is disabled unless an explicit MLX configuration is supplied
  - all registered microtrace assertions pass in optimized and assertion-enabled builds
  - canonical replay is byte-identical
  - original DSAGEN vecadd regression remains exact with overlay disabled
  - source patch contains no warp, SIMT, CTA, or GPU-coherence state
  - no MLX paper result value is consumed

