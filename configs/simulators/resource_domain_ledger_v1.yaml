registered_metrics:
  compute_physical_capacity: productive_pe_compute / (end_to_end_cycles * physical_pes)
  compute_global_end_busy: productive_global_compute / end_to_end_cycles
  compute_global_overlay_busy: productive_global_compute / overlay_cycles
  compute_issue_end: compute_issue_cycles / end_to_end_cycles
  external_load_pe_service: external_read_requests / (end_to_end_cycles * physical_pes)
  external_store_pe_service: external_write_requests / (end_to_end_cycles * physical_pes)
  xfer_issue_pe_service: issued_xfers / (end_to_end_cycles * physical_pes)
  xfer_hop_pe_service: route_hops / (end_to_end_cycles * physical_pes)
  dma_byte_capacity: offchip_bytes / (end_to_end_cycles * dma_bytes_per_cycle)
  spad_operation_capacity: spad_requests / (end_to_end_cycles * total_issue_width)
  spad_wire_byte_capacity: spad_payload_bytes / (end_to_end_cycles * total_banks * bank_width_bytes)
  spad_payload_byte_capacity: spad_payload_bytes / (end_to_end_cycles * total_issue_width * vector_bytes)
  launch_fraction: (end_to_end_cycles - overlay_cycles) / end_to_end_cycles

acceptance:
  require_exact_external_internal_load_partition: true
  require_exact_request_byte_hop_conservation: true
  require_all_registered_metrics_finite: true
  require_bounded_fraction_metrics: true
  require_no_metric_or_schema_selection: true
  require_no_paper_performance_targets: true

