adapter_contract:
  activation: memory_backend equals dsagen_dma
  start_in_roi: true
  transfer_index: 126
  issue_path: Overlay -> Gem5DmaAdapter -> Minor::LSQ::pushRequest
  load_completion: ordered LSQ response completion
  store_progress: MLX transfer queue -> existing Minor store buffer
  store_completion: LSQ recvTimingResp after completed write response
  hierarchy: L1D -> L2 -> DDR4_2400_16x4
  synthetic_latency_model_allowed: false
  write_payload: deterministic_zero_bytes

microtrace:
  mesh: [4, 4]
  active_window: 16
  blocks: 16
  iterations_per_block: 4
  scalar_bytes: 8
  reads: 64
  stores: 64
  computes: 64
  cold_read_stride_bytes: 4096
  per_iteration_line_stride_bytes: 64
  write_block_stride_bytes: 256
  guest_cold_region_bytes: 131072
  guest_cold_target_initial_byte: 1
  expected_dma_read_byte_sum: 512
  guest_write_region_bytes: 4096
  guest_write_initial_byte: 165
  expected_fixed_store_checksum: 84480
  expected_dma_store_checksum: 0
  cache_conditioning:
    region_bytes: 2097152
    read_stride_bytes: 64
    execution: before_begin_roi_in_both_fixed_and_dma_runs
    ordering: after_cold_target_initialization
    excluded_from_roi_stats: true

gem5:
  cpu_type: MinorCPU
  cpu_clock: 1GHz
  system_clock: 1GHz
  l1d_size: 32kB
  l1d_assoc: 8
  l1i_size: 16kB
  l2_size: 512kB
  memory: DDR4_2400_16x4

registered_checks:
  - deterministic ELF-symbol-derived fixed and DMA configs
  - exact 16-block and 64-load/64-compute/64-store structure
  - transfer index does not overlap active DSAGEN input ports or reserved indices 127/128
  - DMA requests use the existing LSQ and gem5 cache/DRAM ports
  - load completion follows the real read response
  - store completion follows the real write response rather than store-buffer insertion
  - fixed and DMA guest checksums distinguish absent and completed writes
  - positive data-cache access delta and positive data-side DRAM evidence
  - requestor-specific cpu.mlx_dma cache occupancy and DRAM counters are present
  - zero request failures and exact request/completion conservation
  - observable queue pressure or concurrent outstanding requests
  - fixed, scratchpad, and disabled-overlay regressions remain exact
  - no MLX paper timing, speedup, utilization, area, or energy target is consumed

compiled_outputs:
  fixed: artifacts/environment/h47/mlx-dma-fixed.json
  dma: artifacts/environment/h47/mlx-dma-real.json
  manifest: artifacts/environment/h47/mlx-dma-compile-manifest.json

result_path: artifacts/results/dsagen-mlx-dma-memory-run053.json
