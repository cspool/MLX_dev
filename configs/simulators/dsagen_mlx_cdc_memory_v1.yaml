event_dependency_contract:
  admission: tags may enter the bounded active window before boundary operands arrive
  block_start: iteration k may issue only after every wait-event count is at least k+1
  event_emit: a completing instruction increments its named event exactly once per iteration
  forward_only: emitted events may target the same logical layer or the immediately next layer only
  overlap_gate: at least one successor-layer compute issue precedes the predecessor tag-complete event
  legacy_predecessors: full-tag predecessor dependencies remain supported for coarse barriers

memory_adapter_contract:
  activation: memory_backend equals dsagen_spad
  issue_path: Overlay load/store -> Gem5ScratchpadAdapter -> RequestBuffer::Decode
  progress_path: accel_t::tick -> ScratchMemory::Step
  completion_path: Response ID interception -> adapter token -> Overlay completion
  timing_source: actual DSAGEN bank FIFO/read/compute/writeback pipeline
  reserved_response_namespace: adapter-owned positive port IDs outside vector-port range
  default_path: fixed-latency backend remains available and unchanged

