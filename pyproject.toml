[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlx-paper-repro"
version = "0.1.0"
description = "Transparent surrogate simulator and experiment harness for the ISCA 2026 MLX paper"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "MLX paper reproduction project"}]
dependencies = [
  "numpy>=1.26",
  "PyYAML>=6.0",
  "matplotlib>=3.8",
  "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
training = [
  "accelerate==1.14.0",
  "bitsandbytes==0.50.1",
  "datasets==5.0.1",
  "einops==0.8.1",
  "evaluate==0.4.6",
  "modelscope==1.39.1",
  "peft==0.20.0",
  "protobuf==6.33.6",
  "sentencepiece==0.2.1",
  "torch==2.13.0",
  "torchvision==0.28.0",
  "transformers==5.15.0",
]

[project.scripts]
mlxsim = "mlxsim.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
