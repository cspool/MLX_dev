outer_loop:
  cycle: 8
  last_direction: "Deepen the Fig. 19 mechanism diagnosis with one no-fit composite 2D-FFT execution that removes only the artificial inter-axis launch and off-chip boundary. Preserve the near-transfer of global-BSMM FFN and do not introduce residual-derived scales."
  last_reflection: "H22 shows the official FABNet model misses both components by about 233%, while H23's H2-calibrated MLX model reduces FFN MAPE to 11.0% and total MAPE to 12.3%. Its remaining failure is concentrated in attention (40.1% MAPE), where the current mapping executes the two FFT axes as isolated workloads despite MLX's claimed cross-stage pipeline. This supplies a specific structural follow-up rather than a free calibration knob."

