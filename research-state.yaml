project:
  title: "MLX paper reproduction"
  question: "Can a transparent open surrogate of the unpublished MLX simulator reproduce every reported experiment within 10% while separating measured, digitized, inferred, and calibrated evidence?"
  status: active
  started: "2026-08-16"
  domain: "spatial accelerator architecture simulation and structured LLM inference"

literature:
  key_papers:
    - id: mlx2026
      title: "MLX: Multi-Layer Execution for Structured LLM Workload Acceleration on Spatial Architectures"
      authors: "Wu et al."
      year: 2026
      relevance: "Target paper and source of all acceptance anchors."
    - id: simict2013
      title: "SimICT: A Fast and Flexible Framework for Performance and Power Evaluation of Large-Scale Architecture"
      authors: "Ye et al."
      year: 2013
      relevance: "The target paper explicitly identifies this as the simulator used for the reduced design."
    - id: dsagen2020
      title: "DSAGEN: Synthesizing Programmable Spatial Accelerators"
      authors: "Weng et al."
      year: 2020
      relevance: "Open full-stack spatial compiler/simulator from an MLX coauthor; closest available surrogate substrate."
    - id: assassyn2025
      title: "Assassyn: Unified Software and Hardware Simulation with Asynchronous Semantics"
      authors: "Weng et al."
      year: 2025
      relevance: "Open asynchronous cycle-simulation/RTL framework from an MLX coauthor; independent semantics reference, not evidence of MLX code reuse."
    - id: fabnet2022
      title: "Adaptable Butterfly Accelerator for Attention-based NNs via Hardware and Algorithm Co-design"
      authors: "Fan et al."
      year: 2022
      relevance: "Official artifact is the strongest public source for the external FABNet model and FPGA latency baseline that MLX explicitly reimplements in Fig. 19."
    - id: butterfly2019
      title: "Learning Fast Algorithms for Linear Transforms Using Butterfly Factorizations"
      authors: "Dao et al."
      year: 2019
      relevance: "Open global-butterfly primitive whose stage semantics and parameter count match MLX's analytical description, but not its hierarchical tiling."
    - id: monarch2022
      title: "Monarch: Expressive Structured Matrices for Efficient and Accurate Training"
      authors: "Dao et al."
      year: 2022
      relevance: "Open dense-to-structured projection precedent; its two-factor structure is not MLX's local log-depth butterfly."
    - id: qalora2024
      title: "QA-LoRA: Quantization-Aware Low-Rank Adaptation of Large Language Models"
      authors: "Xu et al."
      year: 2024
      relevance: "MLX's cited adapter reference, but its 4-bit recipe and defaults do not identify MLX's undisclosed FP16 LoRA setup."
  open_problems:
    - "The target MLX simulator, RTL, compiler, model checkpoints, and raw plot data are not public."
    - "The paper omits many low-level latency, SRAM, DRAM, compiler schedule, and calibration parameters."
    - "Several plots must be digitized from raster figures before numerical reproduction can be audited."
  evidence_gaps:
    - "Need verify whether SimICT source is publicly obtainable."
    - "Need identify exact open GPU simulator suitable for the H100/Orin/Xavier comparison."
    - "Need recover all per-point targets from Figures 2, 3, and 15-25."
    - "No public evidence links MLX to Assassyn beyond related mechanisms and a shared author; MLX-specific tags, skip hops, and workload mapping are absent."
    - "Open Butterfly, Monarch, FABNet, and QA-LoRA artifacts constrain operator and training precedents but do not disclose MLX's tile initialization, per-layer FFT lengths, decompression wiring, modified-layer identities, or LoRA recipe."

hypotheses:
  - id: H1
    statement: "MLX is most plausibly a SimICT-hosted specialization of the authors' DFU/DSA lineage; DSAGEN is the closest open spatial surrogate, while Accel-Sim/GPGPU-Sim can cover GPU baselines."
    status: supported
    motivation: "Select an evidence-grounded, reproducible substrate without pretending the unpublished code is available."
    parent: null
    priority: high
  - id: H2
    statement: "A block/tag-level discrete-event model with decoupled load, compute, and transfer queues can reproduce MLX cycle results within 10% after calibrating only parameters not disclosed by the paper."
    status: pending
    motivation: "This is the architectural mechanism claimed by the paper and the central simulator deliverable."
    parent: null
    priority: high
  - id: H3
    statement: "Closed dependency components, skip-hop routing, and bounded tag windows explain the reported 90% compute utilization and near-linear SIMD/mesh scaling."
    status: pending
    motivation: "Tests whether calibrated agreement follows the proposed mechanism rather than per-figure constants."
    parent: H2
    priority: high
  - id: H4
    statement: "Analytical structured-operator FLOP/traffic models reproduce the reported FFT-CMP and hierarchical-BSMM reductions across model shapes."
    status: pending
    motivation: "Connect the algorithm and architecture experiments with common workload descriptions."
    parent: null
    priority: high
  - id: H5
    statement: "The complete reported experiment suite can be regenerated from versioned manifests with per-point provenance and <=10% absolute relative error."
    status: pending
    motivation: "Defines full-paper completion rather than matching a few headline averages."
    parent: null
    priority: high
  - id: H6
    statement: "A Fig. 3-calibrated, hardware-spec Xavier roofline plus the MLX event model predicts held-out Fig. 20/21 performance and first-principles memory within 10%."
    status: rejected
    motivation: "Create an honest cross-device validation after Fig. 24/25 were consumed as saturated calibration replays."
    parent: H2
    priority: high
  - id: H7
    statement: "Reported totals and normalized metrics across Tables II/IV/V and Figures 18/19 are arithmetically consistent within 10%."
    status: rejected
    motivation: "Separate reproducible reported-number arithmetic from unavailable RTL, FPGA, and prior-accelerator implementations."
    parent: H5
    priority: medium
  - id: H8
    statement: "Digitized Fig. 2 execution stacks and Fig. 3 roofline points are consistent with the paper's annotated speedups and hardware ceilings within 10%."
    status: supported
    motivation: "Complete the GPU motivation-figure manifests without presenting raster replay as native profiling."
    parent: H5
    priority: medium
  - id: H9
    statement: "Equation-derived QKV-plus-attention operation counts, using hierarchical-BSMM density 2*log2(B)/B and s^2 attention scaling, reproduce every digitized MLX-method compute-remaining bar in Fig. 15/16 within 10%."
    status: supported
    motivation: "Test whether the reported algorithmic compute savings follow from the disclosed structured operators before introducing any training-dependent quality metric."
    parent: H4
    priority: high
  - id: H10
    statement: "The pinned unmodified InternLM2-7B checkpoint evaluated on the official WikiText-2 raw test split with frozen 1024-token BF16 causal-LM scoring reproduces Fig. 15(d)'s annotated original perplexity of 8.02 within 10%."
    status: supported
    motivation: "Establish a native checkpoint/data quality baseline before introducing reconstructed FFT compression, hierarchical BSMM, or LoRA training."
    parent: H5
    priority: high
  - id: H11
    statement: "A pinned public BERT-base checkpoint fine-tuned once on official SQuAD 1.1 with a frozen standard QA recipe reproduces Fig. 15(b)'s annotated original F1 87.7 and exact match 79.1 within 10%."
    status: supported
    motivation: "Establish a native BERT quality baseline before reconstructing the paper's undisclosed layer-wise FFT compression and hierarchical-BSMM retraining."
    parent: H5
    priority: high
  - id: H12
    statement: "Frozen raster coordinates and printed annotations recover every Fig. 15/16 model-quality bar with explicit <=0.15-point accuracy or <=0.12 perplexity uncertainty."
    status: supported
    motivation: "Create immutable full-quality targets before any structured-layer training can use the plots, preventing residual-guided target selection."
    parent: H5
    priority: high
  - id: H13
    statement: "The official FABNet BE-40 Python performance model at the source-identified FABNet-Large configuration reproduces all four digitized Fig. 19 FABNet total latencies within 10%."
    status: rejected
    motivation: "Test a genuinely open, explicitly cited accelerator simulator against MLX's external-baseline bars without fitting any hardware or workload parameter to the raster."
    parent: H5
    priority: high
  - id: H14
    statement: "An explicitly inferred real-preserving chunked FFT compressor/decompressor and tiled log-depth butterfly projection satisfy all paper-testable tensor, parameter-count, identity, and numerical-equivalence invariants."
    status: supported
    motivation: "Establish a transparent executable operator contract before any target-facing structured-model training, while separating inferred semantics from author-disclosed facts."
    parent: H4
    priority: high
  - id: H15
    statement: "The H14 inferred operators, initialized by a frozen dense-weight fit and retrained from the H11 checkpoint, reproduce all ten Fig. 15(b) BERT last-k F1/EM targets within 10%."
    status: rejected
    motivation: "Move from formula and operator tests to native structured-model quality while making every undisclosed recipe choice explicit and immutable."
    parent: H5
    priority: high
  - id: H16
    statement: "A byte-verified official Llama2-7B checkpoint and frozen WikiText-2 activation protocol reproduce the Fig. 6 K-energy bars within 10% and the qualitative Fig. 5 frequency-locality directions."
    status: rejected
    motivation: "Test the model-activation evidence used to motivate semantic Fourier compression without depending on the unpublished MLX simulator or training recipe."
    parent: H4
    priority: high
  - id: H17
    statement: "Frozen Fig. 17 pixels recover all 20 H100 speedup bars and reconcile their visual series identities with the paper's prefill/decode prose anchors."
    status: supported
    motivation: "Correct the existing legend-order ambiguity and establish immutable native-benchmark targets before implementing any timing runner."
    parent: H5
    priority: high
  - id: H18
    statement: "Fig. 3 H100 component throughputs plus the disclosed B=32 and s=0.5 work fractions predict all five Fig. 17 prefill-eager speedups within 10% without timing calibration."
    status: rejected
    motivation: "Test whether the paper's public H100 profiles are sufficient to reconstruct its native performance curve before attempting a non-H100 hardware boundary run."
    parent: H5
    priority: high
  - id: H19
    statement: "The byte-qualified official Llama2-7B checkpoint evaluated over all complete WikiText-2 raw-test 1024-token windows reproduces Fig. 15(d)'s original perplexity 6.62 within 10%."
    status: supported
    motivation: "Complete the second native LLM baseline using already qualified public inputs before introducing reconstructed compression or LoRA."
    parent: H5
    priority: high
  - id: H20
    statement: "An inferred post-RoPE chunk-FFT wiring at s=0.75 plus rank-8 LoRA on the last 20 Llama2 layers reproduces Fig. 15(d)'s 5.781 WikiText-2 perplexity within 10%."
    status: rejected
    motivation: "Isolate whether an executable semantic-FFT/LoRA path can recover the first compressed Llama quality point while explicitly excluding the still-unidentified B=32 BSMM initialization."
    parent: H5
    priority: high
  - id: H21
    statement: "The official FGSCR-42 release and an independently indexed mirror permit anonymous corpus-byte retrieval and publish labels plus a deterministic split sufficient for native Fig. 15(a)/16 ViT training."
    status: rejected
    motivation: "Distinguish a genuine public-input path from an inaccessible share or an invented dataset split before spending GPU time on an irreproducible ViT recipe."
    parent: H5
    priority: high
  - id: H22
    statement: "At the source-identified FABNet-Large/BE-40 point, the official simulator's separate FFT-attention and butterfly-FFN cycles reproduce all eight Fig. 19 FABNet stack segments within 10%."
    status: rejected
    motivation: "Use previously untested component outputs to localize H13's total-latency failure without fitting another hardware point."
    parent: H13
    priority: medium
  - id: H23
    statement: "The H2-calibrated full-design event simulator directly maps FABNet-Large's two-axis FFT and global butterfly FFN to reproduce all eight Fig. 19 MLX component segments within 10%, without Fig. 19 fitting."
    status: rejected
    motivation: "Test whether the central event model transfers to a previously unsimulated end-to-end FPGA workload and localize any remaining cycle-semantics gap."
    parent: H2
    priority: high
  - id: H24
    statement: "A single-launch, array-resident composite of FABNet-Large's hidden- and token-axis FFT stages reproduces all four Fig. 19 MLX attention segments within 10% without changing operations or H2 issue rates."
    status: pending
    motivation: "Test whether H23's attention error comes from artificial inter-axis launch and store/load boundaries rather than an empirical throughput scale."
    parent: H23
    priority: high

