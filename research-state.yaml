project:
  title: "MLX core-architecture performance reproduction"
  question: "Can a transparent open surrogate reproduce the MLX paper's core architectural innovations as clear, directionally matching gains over qualified same-work baselines, while retaining full-figure and 10% results only as diagnostics?"
  status: active
  started: "2026-08-16"
  domain: "spatial accelerator architecture simulation and structured LLM inference"

active_simulator_scope:
  status: core_trends_and_functional_goal_complete
  included_figures: [18, 19, 20, 21, 22, 23, 24, 25]
  completion_unit: core_architecture_comparative_claim
  required_full_figures: 8
  reproduced_full_figures: 3
  strict_reproduced_full_figures: 0
  relative_error_limit: 0.10
  primary_completion_criterion: qualitative_trend_with_clear_improvement
  minimum_clear_speedup: 1.20
  strict_10pct_role: retained_secondary_diagnostic
  full_figure_role: retained_secondary_diagnostic
  core_priority_figures: [21, 22, 23, 25]
  core_claims:
    - tagged_cdc_and_multi_layer_latency_hiding
    - simd_scaling
    - mesh_scaling_and_skip_hop_routing
    - full_array_resource_utilization
    - complete_block_end_to_end_gain_over_same_work_baseline
  reproduced_core_claims:
    - tagged_cdc_and_multi_layer_latency_hiding
    - simd_scaling
    - mesh_scaling_and_skip_hop_routing
    - full_array_resource_utilization
    - complete_block_end_to_end_gain_over_same_work_baseline
  reproduced_supporting_claims:
    - dpu_double_buffer_non_stop_flow
    - bounded_context_dpu_overlap
    - multiport_data_supply
  core_claim_certificate:
    experiment_id: H154
    run_id: run159
    path: artifacts/results/core-architecture-claims-run159.json
    sha256: 3b7bba0021a03d13252884bd81361a5cbfd35d699ceddbc1d72c62595891208c
    primary_claims_reproduced: 5
    primary_claims_total: 5
    supporting_claims_reproduced: 3
    supporting_claims_total: 3
  final_verification:
    ruff: passed
    pytest_passed: 416
    pytest_failed: 0
    pytest_warnings: 17
    verified_at: "2026-08-18"
  deprioritized_comparisons:
    - prior_accelerator_absolute_numbers
    - exact_gpu_kernel_magnitude_when_not_needed_for_core_claim
    - complete_non_core_figure_coverage
  excluded:
    - accuracy_perplexity_and_training
    - algorithm_only_flop_reduction
    - standalone_native_gpu_profiling
    - other_simulator_independent_results
  rule: "Primary completion is per core comparative claim: qualified same-work baseline, matching direction, and >=1.2x clear gain. Full-figure coverage and <=10% numerical agreement are diagnostics only. Excluded or deprioritized experiments remain provenance and must not motivate simulator changes."
  stalled_experiment_policy:
    - freeze_the_result_and_residual_without_target_fitting
    - pivot_to_another_experiment_that_isolates_the_missing_mechanism
    - validate_the_mechanism_target_free
    - regress_all_functional_and_same_work_performance_evidence
    - return_to_the_original_experiment_as_a_held_out_transfer
    - preserve_negative_results_when_cross_experiment_evidence_rejects_the_mechanism
  mcp_evidence:
    - "VII.-EVALUATION.md: Figures 15-17 are algorithmic/training validation."
    - "A.-Software--Hardware-Implementation.md: cycle-accurate simulator plus taped-out performance; reduced design simulator tuning."
    - "B.-MLX-Performance.md: Figures 18-21 hardware-performance results."
    - "C.-Resource-Utilization-and-Scalability.md: Figures 22-25 utilization/scalability/sensitivity results."

literature:
  key_papers:
    - id: mlx2026
      title: "MLX: Multi-Layer Execution for Structured LLM Workload Acceleration on Spatial Architectures"
      authors: "Wu et al."
      year: 2026
      relevance: "Target paper and source of all acceptance anchors."
    - id: simict2013
      title: "SimICT: A Fast and Flexible Framework for Performance and Power Evaluation of Large-Scale Architecture"
      authors: "Ye et al."
      year: 2013
      relevance: "The target paper cites this framework at the reduced-design simulator-tuning sentence; H34 does not establish source-code reuse."
    - id: dsagen2020
      title: "DSAGEN: Synthesizing Programmable Spatial Accelerators"
      authors: "Weng et al."
      year: 2020
      relevance: "Open full-stack spatial compiler/simulator from an MLX coauthor; closest available surrogate substrate."
    - id: assassyn2025
      title: "Assassyn: Unified Software and Hardware Simulation with Asynchronous Semantics"
      authors: "Weng et al."
      year: 2025
      relevance: "Open asynchronous cycle-simulation/RTL framework from an MLX coauthor; independent semantics reference, not evidence of MLX code reuse."
    - id: fabnet2022
      title: "Adaptable Butterfly Accelerator for Attention-based NNs via Hardware and Algorithm Co-design"
      authors: "Fan et al."
      year: 2022
      relevance: "Official artifact is the strongest public source for the external FABNet model and FPGA latency baseline that MLX explicitly reimplements in Fig. 19."
    - id: butterfly2019
      title: "Learning Fast Algorithms for Linear Transforms Using Butterfly Factorizations"
      authors: "Dao et al."
      year: 2019
      relevance: "Open global-butterfly primitive whose stage semantics and parameter count match MLX's analytical description, but not its hierarchical tiling."
    - id: monarch2022
      title: "Monarch: Expressive Structured Matrices for Efficient and Accurate Training"
      authors: "Dao et al."
      year: 2022
      relevance: "Open dense-to-structured projection precedent; its two-factor structure is not MLX's local log-depth butterfly."
    - id: qalora2024
      title: "QA-LoRA: Quantization-Aware Low-Rank Adaptation of Large Language Models"
      authors: "Xu et al."
      year: 2024
      relevance: "MLX's cited adapter reference, but its 4-bit recipe and defaults do not identify MLX's undisclosed FP16 LoRA setup."
  open_problems:
    - "H33 found no qualifying public MLX simulator, RTL, compiler, model/checkpoint manifest, or raw trace artifact as of 2026-08-17."
    - "The paper omits many low-level latency, SRAM, DRAM, compiler schedule, and calibration parameters."
    - "H37 completes target/evidence coverage, but 17 of 18 full experiment rows remain rejected, replay-only, or publicly blocked."
  evidence_gaps:
    - "H34-H36 support SimICT only at citation level; first-party access recovery and the supplied Fig. 14 text audit add no explicit derivation, leaving the DFU-E/M2-DFU family and exact taped-out parent unresolved."
    - "No source-qualified simulator or native trace spans the paper's Volta Xavier, Ampere RTX 3090/Orin, and Hopper H100 comparisons."
    - "All per-point targets are recovered; the remaining gap is regenerating author measurements rather than target acquisition."
    - "No public evidence links MLX to Assassyn beyond related mechanisms and a shared author; MLX-specific tags, skip hops, and workload mapping are absent."
    - "Open Butterfly, Monarch, FABNet, and QA-LoRA artifacts constrain operator and training precedents but do not disclose MLX's tile initialization, per-layer FFT lengths, decompression wiring, modified-layer identities, or LoRA recipe."

