name: transformer_block
operator: combined structured Transformer block microkernel
inputs:
  x0: {pattern: [1.0, 2.0, 1.0, 2.0]}
  x1: {pattern: [2.0, 1.0, 2.0, 1.0]}
  one: {fill: 1.0}
  two: {fill: 2.0}
  half: {fill: 0.5}
  zero: {fill: 0.0}
  v0: {pattern: [2.0, 4.0, 2.0, 4.0]}
  v1: {pattern: [4.0, 2.0, 4.0, 2.0]}
output_slots: [64]
program:
  0:
    - {op: load, dst: 0, spm: x0}
    - {op: load, dst: 1, spm: x1}
    - {op: load, dst: 2, spm: one}
    - {op: fma, dst: 3, src0: 1, src1: 2, src2: 0}
    - {op: store, src0: 3, spm: 16}
  1:
    - {op: load, dst: 0, spm: x0}
    - {op: load, dst: 1, spm: x1}
    - {op: load, dst: 2, spm: two}
    - {op: load, dst: 3, spm: one}
    - {op: mul, dst: 4, src0: 0, src1: 2}
    - {op: fma, dst: 5, src0: 1, src1: 3, src2: 4}
    - {op: store, src0: 5, spm: 17}
  4:
    - {op: load, dst: 0, spm: 16}
    - {op: load, dst: 1, spm: 17}
    - {op: add, dst: 2, src0: 0, src1: 1}
    - {op: store, src0: 2, spm: 20}
    - {op: xfer, src0: 2, dst: 0, target_pe: 8}
  5:
    - {op: load, dst: 0, spm: 16}
    - {op: load, dst: 1, spm: 17}
    - {op: load, dst: 2, spm: one}
    - {op: fma, dst: 3, src0: 1, src1: 2, src2: 0}
    - {op: shuffle, dst: 4, src0: 3}
    - {op: store, src0: 4, spm: 21}
    - {op: xfer, src0: 4, dst: 0, target_pe: 9}
  8:
    - {op: load, dst: 1, spm: x0}
    - {op: add, dst: 2, src0: 0, src1: 1}
    - {op: xfer, src0: 2, dst: 0, target_pe: 12}
  9:
    - {op: load, dst: 1, spm: zero}
    - {op: max, dst: 2, src0: 0, src1: 1}
    - {op: xfer, src0: 2, dst: 1, target_pe: 12}
  10:
    - {op: load, dst: 0, spm: v0}
    - {op: load, dst: 1, spm: v1}
    - {op: load, dst: 2, spm: half}
    - {op: add, dst: 3, src0: 0, src1: 1}
    - {op: mul, dst: 4, src0: 3, src1: 2}
    - {op: xfer, src0: 4, dst: 2, target_pe: 12}
  11:
    - {op: load, dst: 0, spm: zero}
    - {op: exp, dst: 1, src0: 0}
    - {op: load, dst: 2, spm: two}
    - {op: div, dst: 3, src0: 1, src1: 2}
    - {op: xfer, src0: 3, dst: 3, target_pe: 12}
  12:
    - {op: add, dst: 4, src0: 0, src1: 1}
    - {op: fma, dst: 5, src0: 2, src1: 3, src2: 4}
    - {op: shuffle, dst: 6, src0: 5}
    - {op: store, src0: 6, spm: 64}
