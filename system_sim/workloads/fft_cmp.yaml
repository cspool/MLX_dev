name: fft_cmp
operator: radix-2 FFT compression microkernel
inputs:
  a: {pattern: [1.0, 2.0, 2.0, 1.0]}
  b: {pattern: [2.0, 1.0, 1.0, 2.0]}
  c: {pattern: [4.0, 2.0, 4.0, 2.0]}
  d: {pattern: [2.0, 4.0, 2.0, 4.0]}
  half: {fill: 0.5}
  neg_one: {fill: -1.0}
output_slots: [64, 65]
program:
  0:
    - {op: load, dst: 0, spm: a}
    - {op: load, dst: 1, spm: b}
    - {op: add, dst: 2, src0: 0, src1: 1}
    - {op: xfer, src0: 2, dst: 0, target_pe: 4}
  1:
    - {op: load, dst: 0, spm: a}
    - {op: load, dst: 1, spm: b}
    - {op: load, dst: 2, spm: neg_one}
    - {op: fma, dst: 3, src0: 1, src1: 2, src2: 0}
    - {op: xfer, src0: 3, dst: 1, target_pe: 4}
  2:
    - {op: load, dst: 0, spm: c}
    - {op: load, dst: 1, spm: d}
    - {op: add, dst: 2, src0: 0, src1: 1}
    - {op: xfer, src0: 2, dst: 0, target_pe: 5}
  3:
    - {op: load, dst: 0, spm: c}
    - {op: load, dst: 1, spm: d}
    - {op: load, dst: 2, spm: neg_one}
    - {op: fma, dst: 3, src0: 1, src1: 2, src2: 0}
    - {op: xfer, src0: 3, dst: 1, target_pe: 5}
  4:
    - {op: shuffle, dst: 2, src0: 1}
    - {op: add, dst: 3, src0: 0, src1: 2}
    - {op: xfer, src0: 3, dst: 0, target_pe: 8}
    - {op: xfer, src0: 3, dst: 0, target_pe: 9}
  5:
    - {op: load, dst: 2, spm: half}
    - {op: mul, dst: 3, src0: 1, src1: 2}
    - {op: add, dst: 4, src0: 0, src1: 3}
    - {op: xfer, src0: 4, dst: 1, target_pe: 8}
    - {op: xfer, src0: 4, dst: 1, target_pe: 9}
  8:
    - {op: load, dst: 2, spm: half}
    - {op: add, dst: 3, src0: 0, src1: 1}
    - {op: mul, dst: 4, src0: 3, src1: 2}
    - {op: store, src0: 4, spm: 64}
  9:
    - {op: load, dst: 2, spm: neg_one}
    - {op: fma, dst: 3, src0: 1, src1: 2, src2: 0}
    - {op: store, src0: 3, spm: 65}

