name: swa
operator: causal sliding-window attention microkernel
inputs:
  q: {pattern: [1.0, 2.0, 1.0, 2.0]}
  k0: {fill: 0.0}
  k1: {fill: 0.0}
  v0: {pattern: [2.0, 4.0, 2.0, 4.0]}
  v1: {pattern: [4.0, 2.0, 4.0, 2.0]}
output_slots: [64, 65]
program:
  0:
    - {op: load, dst: 0, spm: q}
    - {op: load, dst: 1, spm: k0}
    - {op: mul, dst: 2, src0: 0, src1: 1}
    - {op: xfer, src0: 2, dst: 0, target_pe: 4}
  1:
    - {op: load, dst: 0, spm: q}
    - {op: load, dst: 1, spm: k1}
    - {op: mul, dst: 2, src0: 0, src1: 1}
    - {op: xfer, src0: 2, dst: 1, target_pe: 4}
  2:
    - {op: load, dst: 0, spm: v0}
    - {op: xfer, src0: 0, dst: 0, target_pe: 5}
  3:
    - {op: load, dst: 0, spm: v1}
    - {op: xfer, src0: 0, dst: 1, target_pe: 5}
  4:
    - {op: max, dst: 2, src0: 0, src1: 1}
    - {op: exp, dst: 3, src0: 0}
    - {op: exp, dst: 4, src0: 1}
    - {op: add, dst: 5, src0: 3, src1: 4}
    - {op: store, src0: 2, spm: 65}
    - {op: xfer, src0: 3, dst: 2, target_pe: 5}
    - {op: xfer, src0: 4, dst: 3, target_pe: 5}
    - {op: xfer, src0: 5, dst: 4, target_pe: 5}
  5:
    - {op: div, dst: 5, src0: 2, src1: 4}
    - {op: div, dst: 6, src0: 3, src1: 4}
    - {op: mul, dst: 7, src0: 0, src1: 5}
    - {op: fma, dst: 8, src0: 1, src1: 6, src2: 7}
    - {op: store, src0: 8, spm: 64}

